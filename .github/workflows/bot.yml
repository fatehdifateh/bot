name: Discord Bot 7/24

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: discord-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: RAR Kur
        run: sudo apt-get install -y rar

      - name: Modülleri Yükle
        run: npm install

      - name: Botu Başlat
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: node index.js
